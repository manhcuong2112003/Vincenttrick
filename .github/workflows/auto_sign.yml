name: Auto-Sign & Health Check Shadowrocket iOS

on:
  schedule:
    # Tự động chạy mỗi 20 phút trên máy chủ GitHub (24/7 kể cả khi tắt PC)
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Auto-Sign & Health Check Manager
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python3 auto_sign_manager.py

      - name: Verify No Conflict Markers & Valid JSON
        run: |
          if grep -rnw "." -e "<<<<<<<" -e "=======" -e ">>>>>>>" --exclude-dir=".git"; then
            echo "❌ PHÁT HIỆN CONFLICT MARKER! HỦY BƯỚC COMMIT ĐỂ BẢO VỆ CODE!"
            exit 1
          fi
          python3 -c "import json; json.load(open('links_cache.json', encoding='utf-8'))"
          echo "✅ File cache JSON hợp lệ, không có conflict markers."

      - name: Commit and Push updated cache only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tách rời: Chỉ commit file dữ liệu links_cache.json & config.json, không sửa index.html
          git add links_cache.json config.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-sign): update Shadowrocket manifest links & status [skip ci]"
            git push
          else
            echo "Không có thay đổi mới cần commit."
          fi
